<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Original Card Game</title>
<link rel="stylesheet" href="css/style.css?v=restore28">
</head>
<body>
<main class="game">
<header><h1>Original Card Game</h1><span>ターン: <b id="turnPlayer">プレイヤー1</b></span></header>
<section class="board">
<aside class="side"><div class="title">カードプレビュー</div><div id="preview" class="preview">カードを選択</div><div class="title">操作</div><div id="ops">カードを選択してください</div></aside>
<section class="table">
<div class="player opponent">
<div class="row hand"><label>手札</label><div id="p2-hand" class="cards"></div></div>
<div class="other"><div class="zone">フィールド<div id="p2-field"></div></div><div class="zone">捨て札<div id="p2-discard"></div></div><div class="zone">デッキ<div id="p2-deck" class="back"></div></div><div class="info"><b id="p2-name">プレイヤー2</b><span>ライフ <b id="p2-life">4000</b></span></div><div class="zone facedown">罠<div id="p2-facedown"></div></div><button data-end>ターン終了</button></div>
<div class="row"><label>エネルギー</label><div id="p2-energy" class="cards"></div></div>
<div class="row monsters"><label>モンスター</label><div id="p2-monsters" class="cards"></div></div>
</div>
<div class="divider">対戦エリア</div>
<div class="player self">
<div class="row monsters"><label>モンスター</label><div id="p1-monsters" class="cards"></div></div>
<div class="row"><label>エネルギー</label><div id="p1-energy" class="cards"></div></div>
<div class="other"><div class="zone">フィールド<div id="p1-field"></div></div><div class="zone">捨て札<div id="p1-discard"></div></div><div class="zone">デッキ<div id="p1-deck" class="back"></div></div><div class="info"><b id="p1-name">プレイヤー1</b><span>ライフ <b id="p1-life">4000</b></span></div><div class="zone facedown">罠<div id="p1-facedown"></div></div><button data-end>ターン終了</button></div>
<div class="row hand"><label>手札</label><div id="p1-hand" class="cards"></div></div>
</div>
</section>
<aside class="side right"><div class="title">プレイヤー設定</div><input id="name" maxlength="16" value="プレイヤー1"><button id="rename">名前を変更</button><div class="title">先攻・後攻</div><button data-first="random">ランダム</button><button data-first="self">自分が先攻</button><button data-first="opponent">相手が先攻</button><button id="reset">自分の盤面をリセット</button><div class="title logtitle">ログ</div><div id="log" class="log"></div></aside>
</section>
</main>
<script src="js/game.js?v=restore07"></script>
</body>
</html>
